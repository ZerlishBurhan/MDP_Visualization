<!DOCTYPE html>
<html lang="en">
<head>
  <!-- FORCE UTF-8 (ONLY ONE CHARSET) -->
  <meta charset="UTF-8">

  <title>Interactive MDP GridWorld</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Interactive MDP GridWorld</h1>

<div class="main-layout">

  <!-- LEFT: GRID -->
  <div class="grid-container">
    <div id="grid"></div>

<div class="legend">
  <div class="legend-item" data-type="goal">
    <span class="legend-icon goal-icon">&#9733;</span>
    <span>Goal (+10)</span>
  </div>

  <div class="legend-item" data-type="danger">
    <span class="legend-icon danger-icon">X</span>
    <span>Danger (−10)</span>
  </div>

  <div class="legend-item" data-type="obstacle">
    <span class="legend-icon obstacle-icon">■</span>
    <span>Obstacle</span>
  </div>

  <div class="legend-item" data-type="policy">
    <span class="legend-icon">&#8593; &#8595; &#8592; &#8594;</span>
    <span>Policy</span>
  </div>

  <div class="legend-item" data-type="value">
    <span class="legend-icon value-icon"></span>
    <span>Value (Color)</span>
  </div>
</div>

  </div>

  <!-- RIGHT: CONTROLS -->
  <div class="controls">

    <div class="control-box">
      <label>Algorithm</label>
      <select id="algo">
        <option value="value">Value Iteration</option>
        <option value="policy">Policy Iteration</option>
      </select>
    </div>

    <div class="control-box">
      <label>Cell Mode</label>
      <select id="cellMode">
        <option value="normal">Normal</option>
        <option value="goal">Set Goal</option>
        <option value="danger">Set Danger</option>
        <option value="obstacle">Set Obstacle</option>
      </select>
    </div>

    <div class="control-box">
      <label>Discount Factor (γ)</label>
      <div class="qty">
        <button onclick="changeGamma(-0.01)">−</button>
        <span id="gammaVal">0.90</span>
        <button onclick="changeGamma(0.01)">+</button>
      </div>
    </div>

    <div class="control-box">
      <label>Theta (θ)</label>
      <div class="qty">
        <button onclick="changeTheta(-0.0005)">−</button>
        <span id="thetaVal">0.0010</span>
        <button onclick="changeTheta(0.0005)">+</button>
      </div>
    </div>

    <div class="control-box">
      <button onclick="runMDP()">Run</button>
      <button onclick="stepMDP()">Next Step</button>
      <button onclick="resetGrid()">Reset</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
